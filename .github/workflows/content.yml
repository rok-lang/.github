# Check and bundle a content repository (docs, www, spec) for the Rok sites.
# A vX.Y.Z branch is checked with rok X.Y.Z, main with the latest release.
# A push that passes asks the deploy pipeline to rebuild the sites.
name: content

on:
  workflow_call:
    inputs:
      check:
        description: Run the rok blocks and compare the documented diagnostics
        type: boolean
        default: true
    secrets:
      GH_DISPATCH_TOKEN_INFRA:
        required: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Libraries the examples link (zlib in the FFI chapter)
        run: sudo apt-get install -y -q zlib1g-dev

      - name: Toolchain for this branch
        id: tc
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) v="${GITHUB_REF_NAME#v}" ;;
            *) v=$(gh release view -R rok-lang/rok --json tagName -q .tagName); v="${v#v}" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          curl -fsSL https://rok-lang.org/install.sh | ROK_VERSION="$v" ROK_NO_MODIFY_PATH=1 sh -s -- -q
          echo "$HOME/.rok/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: rok-lang/web
          path: .web

      - name: Build rok-content
        run: cd .web/tools/content && rok build --release

      - name: Check
        if: inputs.check
        run: .web/tools/content/target/release/rok_content check .
        env:
          # rokc's C driver finds system libraries (-lz) through LIBRARY_PATH.
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu

      - name: Bundle
        run: >
          .web/tools/content/target/release/rok_content bundle .
          --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
          --toolchain "$TOOLCHAIN" --out bundle.rokon
        env:
          TOOLCHAIN: ${{ steps.tc.outputs.version }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle
          path: bundle.rokon

  deploy:
    needs: bundle
    if: github.event_name == 'push'
    permissions: {}
    uses: rok-lang/.github/.github/workflows/deploy.yml@main
    with:
      site: content
    secrets:
      GH_DISPATCH_TOKEN_INFRA: ${{ secrets.GH_DISPATCH_TOKEN_INFRA }}
